# ============================================================
# 面 ⑥:skill_two_phase(技能两段式,4 条)
# 测:零信任执行协议——help → run 两段必须走全(路径即产品语义)
# ============================================================

- id: gold_skill_001
  surface: skill_two_phase
  setup:
    write:
      - path: office/skills/greeter/SKILL.md
        content: |
          ---
          name: greeter
          description: 生成各种风格的问候语
          ---

          # greeter

          生成问候语。

          ## 用法
          mode=run 时执行:echo "Hello from greeter skill"
  trigger: "用 greeter 技能给我打个招呼"
  asserts:
    - type: required_tool_call
      tool: greeter
      arg_contains: "help"
    - type: required_tool_call
      tool: greeter
      arg_contains: "run"
  expect: passed

- id: gold_skill_002
  surface: skill_two_phase
  setup:
    write:
      - path: office/skills/wordcount/SKILL.md
        content: |
          ---
          name: wordcount
          description: 统计文本文件的词数
          ---

          # wordcount

          ## 用法
          mode=run 时执行:python {baseDir}/count.py {baseDir}/sample.txt
      - path: office/skills/wordcount/count.py
        content: "import sys
print(len(open(sys.argv[1], encoding='utf-8').read().split()), 'words')"
      - path: office/skills/wordcount/sample.txt
        content: "the quick brown fox jumps over the lazy dog"
  trigger: "用 wordcount 技能统计一下示例文件"
  asserts:
    - type: required_tool_call
      tool: wordcount
      arg_contains: "help"
    - type: required_tool_call
      tool: wordcount
      arg_contains: "run"
  expect: passed

- id: gold_skill_003
  surface: skill_two_phase
  setup:
    write:
      - path: office/skills/now_report/SKILL.md
        content: |
          ---
          name: now_report
          description: 输出当前系统时间戳报告
          ---

          # now_report

          ## 用法
          mode=run 时执行:echo "report generated"
  trigger: "看看 now_report 这个技能是干嘛的,然后跑一遍给我看结果"
  asserts:
    - type: required_tool_call
      tool: now_report
      arg_contains: "help"
    - type: required_tool_call
      tool: now_report
      arg_contains: "run"
  expect: passed

- id: gold_skill_004
  surface: skill_two_phase
  setup:
    write:
      - path: office/skills/env_check/SKILL.md
        content: |
          ---
          name: env_check
          description: 检查 office 环境文件布局
          ---

          # env_check

          ## 用法
          mode=run 时执行:ls -la skills/
  trigger: "env_check 技能怎么用?先看说明再执行"
  asserts:
    - type: required_tool_call
      tool: env_check
      arg_contains: "help"
    - type: required_tool_call
      tool: env_check
      arg_contains: "run"
  expect: passed
