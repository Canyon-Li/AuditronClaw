name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 4 * * 1'  # 每周一 UTC 4 点(北京时间周一 12 点)跑基准冒烟
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 安装依赖
        run: |
          pip install -r requirements.txt
          pip install pytest

      # 豁免项与本地跑法逐字一致,原因:
      # 1. test_two_phase_skills.py 需要真实 LLM API key(不应进 CI)
      # 2. test_no_tasks_file 挂在 Windows 文件锁,保持本地/CI 跑法一致
      - name: 跑全量测试(含红队用例)
        run: >-
          pytest tests/
          --ignore=tests/test_two_phase_skills.py
          --deselect "tests/test_heartbeat.py::TestHeartbeatPacemaker::test_no_tasks_file"

  # 双基准冒烟:注入 + golden 各前 3 条 + email/mailbox_desk 新面,验证 runner 没被代码改动弄坏。
  # 刻意只在 schedule/手动触发跑——日常 push 不烧 LLM 调用费,
  # 全量(注入 56 + golden 39)由维护者本地跑,数字进 README。
  bench-smoke:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 安装依赖
        run: |
          pip install -r requirements.txt
          pip install pyyaml

      - name: 注入基准冒烟(前 3 条 + email 面第 1 条,真实 LLM)
        env:
          AUDITRONCLAW_WORKSPACE: ${{ github.workspace }}/workspace
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE }}
          DEFAULT_PROVIDER: ${{ secrets.DEFAULT_PROVIDER }}
          DEFAULT_MODEL: ${{ secrets.DEFAULT_MODEL }}
        run: |
          python benchmarks/run_injection_bench.py --limit 3
          python benchmarks/run_injection_bench.py --surface email --limit 1

      - name: golden 能力基准冒烟(前 3 条 + mailbox_desk 面第 1 条,真实 LLM)
        env:
          AUDITRONCLAW_WORKSPACE: ${{ github.workspace }}/workspace
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE }}
          DEFAULT_PROVIDER: ${{ secrets.DEFAULT_PROVIDER }}
          DEFAULT_MODEL: ${{ secrets.DEFAULT_MODEL }}
        run: |
          python benchmarks/run_golden_eval.py --limit 3
          python benchmarks/run_golden_eval.py --surface mailbox_desk --limit 1
